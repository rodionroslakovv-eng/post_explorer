name: post_explorer
description: Post Explorer — SRS 8. Dio + Retrofit + json_serializable + кэш + пагинация.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  retrofit_generator: ^10.3.2

flutter:
  uses-material-design: true

